<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Richiesta - Rooting Future</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #667eea; --bg: #0f172a; --text: #f1f5f9; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .container { max-width: 500px; width: 90%; text-align: center; padding: 3rem; background: #1e293b; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        .icon { font-size: 5rem; margin-bottom: 1.5rem; }
        h1 { font-size: 2rem; color: var(--primary); margin-bottom: 1rem; }
        p { font-size: 1rem; color: #94a3b8; line-height: 1.6; margin-bottom: 2rem; }
        form { margin-bottom: 1.5rem; }
        input[type="password"] { width: 100%; padding: 1rem; border: 2px solid #334155; background: #0f172a; color: white; border-radius: 12px; font-size: 1rem; margin-bottom: 1rem; box-sizing: border-box; }
        input[type="password"]:focus { outline: none; border-color: var(--primary); }
        .btn { background: var(--primary); color: white; padding: 1rem 2.5rem; border: none; border-radius: 12px; font-weight: 600; font-size: 1rem; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn:hover { background: #764ba2; transform: translateY(-2px); }
        .error { background: #dc2626; color: white; padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔐</div>
        <h1>Password Richiesta</h1>
        <p>Questo piano strategico è protetto da password.<br>Inserisci la password fornita dal proprietario per accedere.</p>

        <div class="error" id="errorMsg">Password non corretta. Riprova.</div>

        <form id="passwordForm">
            <div id="pwError" style="display:none;color:#f87171;font-size:0.85rem;margin-bottom:0.5rem;"></div>
            <input type="password" id="passwordInput" placeholder="Inserisci la password" autofocus required>
            <button type="submit" class="btn">Accedi al Piano</button>
        </form>

        <p style="font-size: 0.9rem; color: #64748b;">
            Se non hai la password, contatta chi ti ha condiviso il link.
        </p>
    </div>

    <script>
        document.getElementById('passwordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const password = document.getElementById('passwordInput').value;
            const shareToken = "{{ share_token }}";

            // POST invece di GET: password non finisce in URL, history o log server
            const resp = await fetch(`/public/${shareToken}/verify`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({password})
            });
            if (resp.ok) {
                window.location.href = `/public/${shareToken}`;
            } else {
                const err = document.getElementById('pwError');
                if (err) { err.textContent = 'Password non corretta.'; err.style.display = 'block'; }
            }
        });
    </script>
</body>
</html>
